# CI: every push and pull request is linted and tested; pushes to master also publish
# the Docker image to ghcr.io/partorg/mcp-gps-fleet (the default image in the Helm chart).
name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege by default; only the image job may write packages.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs uv and the Python version from .python-version (3.14).
      # setup-uv publishes only full version tags (no moving "v10"), so pin the exact one.
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      # There is no Ollama on the runner: the RAG quality tests are skipped (marked "s"),
      # everything else (DB, tools, transports, auth, chat wiring) runs.  The retrieval
      # gate runs locally, where Ollama is available: uv run pytest / uv run fleet-eval.
      - run: uv run pytest -rs
      - uses: azure/setup-helm@v5
      - run: helm lint charts/fleet-mcp

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the workflow's own short-lived token
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4 # BuildKit, needed for the Dockerfile's cache mounts
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          # Pull requests only check that the image builds; pushes to master publish it.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/partorg/mcp-gps-fleet:latest
            ghcr.io/partorg/mcp-gps-fleet:${{ github.sha }}
