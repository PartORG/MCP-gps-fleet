{{- if .Values.ollama.enabled }}
{{- /*
Ollama, only for embeddings (nomic-embed-text, pulled by fleet-ingest on first start).
ponytail: models live in an emptyDir, so a new Ollama pod re-pulls ~274 MB; use a
PersistentVolumeClaim if that becomes annoying.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ollama
  labels: &labels
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          ports:
            - { name: http, containerPort: 11434 }
          # GET / answers "Ollama is running" as soon as the API is up.
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          volumeMounts:
            - { name: models, mountPath: /root/.ollama }
          resources: {{- toYaml .Values.ollama.resources | nindent 12 }}
      volumes:
        - { name: models, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ollama
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: http, port: 11434, targetPort: http }
{{- end }}
